name: Tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: course_tuition_center_mis_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and test
        working-directory: backend
        env:
          TEST_DB: mysql
          DB_ENGINE: mysql
          DB_NAME: course_tuition_center_mis_test
          DB_USER: root
          DB_PASSWORD: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
        run: |
          python -m pip install -r requirements.txt
          python manage.py test apps.common.tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test and build
        working-directory: frontend
        run: |
          npm install
          npm test
          npm run build
